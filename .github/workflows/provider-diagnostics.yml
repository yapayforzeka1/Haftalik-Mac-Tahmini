name: AI Sağlayıcı Teşhisi
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: Sağlayıcıları kontrol et
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL || 'mistral-small-latest' }}
          COHERE_MODEL: ${{ vars.COHERE_MODEL || 'command-a-plus-05-2026' }}
        run: python diagnose_providers.py
