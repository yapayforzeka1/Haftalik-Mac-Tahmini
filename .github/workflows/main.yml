name: Haftalık Maç Tahmini

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      test_mode:
        description: "Telegram maç tahmin akışını test et"
        required: true
        default: false
        type: boolean
      report_test_mode:
        description: "Haftalık + genel performans görsellerini test et"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: haftalik-mac-tahmini
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai mistralai groq cohere pydantic pillow

      - name: Core testleri
        run: python test_core.py

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANALYSIS_TELEGRAM_BOT_TOKEN: ${{ secrets.ANALYSIS_TELEGRAM_BOT_TOKEN }}
          ANALYSIS_TELEGRAM_CHAT_ID: ${{ secrets.ANALYSIS_TELEGRAM_CHAT_ID }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          TEST_MODE: ${{ inputs.test_mode || false }}
          REPORT_TEST_MODE: ${{ inputs.report_test_mode || false }}
        run: python bot.py

      - name: Arşivleri kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in match_predictions.json weekly_reports.json weekly_schedule.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Haftalık maç tahmin ve performans arşivlerini güncelle"
            git push
          else
            echo "Kaydedilecek yeni değişiklik yok."
          fi
