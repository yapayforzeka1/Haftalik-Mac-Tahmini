name: Şampiyonlar Ligi Tahmin Botu

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      - name: Repository'yi indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketleri kur
        run: |
          pip install requests google-genai

      - name: Gemini bağlantısını test et
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemini_test.py

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python bot.py

      - name: Gönderilen maçları kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f match_predictions.json ]; then
            git add match_predictions.json

            if ! git diff --cached --quiet; then
              git commit -m "Maç tahminlerini güncelle"
              git push
            else
              echo "Kaydedilecek yeni değişiklik yok."
            fi
          else
            echo "match_predictions.json bulunamadı."
          fi
