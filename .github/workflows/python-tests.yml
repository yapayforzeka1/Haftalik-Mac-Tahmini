name: Python Tests (No AI Tokens)

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx requests

      - name: Run offline FotMob tests
        env:
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          COHERE_API_KEY: ""
          CLOUDFLARE_API_TOKEN: ""
          FOOTBALL_DATA_API_KEY: ""
          API_FOOTBALL_KEY: ""
        run: |
          python -m pytest tests/ -v
