name: Cohere Ayar Karşılaştırması
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: provider-diagnostics
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: Cohere ayarlarını karşılaştır
        env:
          PYTHONUNBUFFERED: "1"
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_MODEL: ${{ vars.COHERE_MODEL || 'command-a-plus-05-2026' }}
        run: python diagnose_cohere.py
